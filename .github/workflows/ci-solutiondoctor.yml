# Integrazione continua di SolutionDoctor: a ogni push o PR compila su Windows (app WPF e XAML compresi), esegue i test,
# pubblica CLI e interfaccia, prova la CLI su ExeBuilder, prova l'interfaccia (avvio e contenuto delle griglie) e rende
# scaricabile tutto come artifact del run.
name: CI SolutionDoctor

on:
  push:
    branches: [ Progetti_Claude, main ]
    paths:
      - 'SolutionDoctor/**'
      - '.github/workflows/ci-solutiondoctor.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'SolutionDoctor/**'
      - '.github/workflows/ci-solutiondoctor.yml'
  workflow_dispatch:

# Un nuovo push sullo stesso branch annulla il run precedente ancora in corso.
concurrency:
  group: ci-solutiondoctor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # la cronologia git serve all'analisi della frequenza di modifica

      - name: Versione
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content 'SolutionDoctor/Directory.Build.props'
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version }).Version
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "SolutionDoctor $version"

      # Compila l'intera solution, app WPF e XAML compresi, ed esegue tutti i test.
      - name: Test
        run: dotnet test SolutionDoctor/SolutionDoctor.sln -c Release

      - name: Pubblica la CLI
        run: dotnet publish SolutionDoctor/src/SolutionDoctor.Cli/SolutionDoctor.Cli.csproj -c Release -o publish/SolutionDoctor-Cli

      - name: Pubblica l'interfaccia
        run: dotnet publish SolutionDoctor/src/SolutionDoctor.App/SolutionDoctor.App.csproj -c Release -o publish/SolutionDoctor-App

      - name: Prova della CLI su ExeBuilder (con cronologia git)
        run: publish/SolutionDoctor-Cli/solutiondoctor.exe analyze ExeBuilder/ExeBuilder.sln -o publish/SolutionDoctor-ExeBuilder.md

      # Un errore nel XAML (risorsa mancante, binding sbagliato in una cella) si vede solo avviando la finestra.
      # L'app parte sulla solution di esempio con l'argomento da riga di comando, analizza da sola; poi, tramite
      # l'accessibilita' di Windows (UI Automation), si apre una per una ogni sezione e si controllano numero di righe
      # e testi della prima riga di ogni griglia: se un binding di cella non funziona, la cella resta vuota e il passo fallisce.
      # Windows PowerShell 5.1 (UIAutomationClient e' garantito) e solo caratteri ASCII nello script.
      - name: Prova di avvio dell'interfaccia
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes

          $process = Start-Process -FilePath 'publish\SolutionDoctor-App\SolutionDoctor.App.exe' -ArgumentList '"SolutionDoctor\samples\LegacyDemo\LegacyDemo.sln"' -PassThru

          function Fail($message) {
            Write-Host "ERRORE: $message"
            try { Stop-Process -Id $process.Id -Force } catch { }
            exit 1
          }

          function Find-All($root, $controlType) {
            $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty, $controlType)
            return $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition)
          }

          # 1. La finestra compare e il titolo diventa "SolutionDoctor - <solution>" solo a risultato mostrato.
          $title = ''
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            if ($process.HasExited) { Fail "L'interfaccia si e' chiusa da sola (codice di uscita $($process.ExitCode))." }
            $process.Refresh()
            $title = $process.MainWindowTitle
            Write-Host "Titolo della finestra: '$title'"
            if ($title -like '*LegacyDemo*') { break }
          }
          if ($title -notlike '*LegacyDemo*') { Fail "La finestra non ha mostrato il risultato entro 90 secondi (ultimo titolo: '$title')." }

          # 2. Le quattro sezioni, con il contenuto delle griglie.
          try {
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
            $tabs = @(Find-All $window ([System.Windows.Automation.ControlType]::RadioButton))
            Write-Host ("Sezioni: " + (($tabs | ForEach-Object { $_.Current.Name }) -join ' | '))
            if ($tabs.Count -ne 4) { Fail "Attese 4 sezioni, trovate $($tabs.Count)." }

            # Legge tutte le righe della griglia visibile (poche) e verifica che i testi attesi compaiano in almeno una.
            function Test-Tab($index, $minimumRows, $expected) {
              $tab = $tabs[$index]
              $tab.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              Start-Sleep -Seconds 1
              $grids = @(Find-All $window ([System.Windows.Automation.ControlType]::DataGrid) | Where-Object { -not $_.Current.IsOffscreen })
              if ($grids.Count -lt 1) { Fail "Sezione '$($tab.Current.Name)': nessuna griglia visibile." }
              $pattern = $grids[0].GetCurrentPattern([System.Windows.Automation.GridPattern]::Pattern)
              $rows = $pattern.Current.RowCount
              $columns = $pattern.Current.ColumnCount
              $lines = @()
              for ($r = 0; $r -lt [Math]::Min($rows, 15); $r++) {
                $cells = @()
                for ($c = 0; $c -lt $columns; $c++) {
                  $cell = $pattern.GetItem($r, $c)
                  $texts = @(Find-All $cell ([System.Windows.Automation.ControlType]::Text) | ForEach-Object { $_.Current.Name })
                  if ($texts.Count -eq 0) { $texts = @($cell.Current.Name) }
                  $cells += ($texts -join '/')
                }
                $lines += ($cells -join ' | ')
              }
              Write-Host ("[{0}] righe={1} colonne={2}" -f $tab.Current.Name, $rows, $columns)
              foreach ($line in $lines) { Write-Host ("    " + $line) }
              if ($rows -lt $minimumRows) { Fail "Sezione '$($tab.Current.Name)': attese almeno $minimumRows righe, trovate $rows." }
              $all = $lines -join "`n"
              foreach ($text in $expected) {
                if ($all -notlike "*$text*") { Fail "Sezione '$($tab.Current.Name)': nessuna riga contiene '$text'." }
              }
            }

            Test-Tab 0 3 @('Gestionale.OrdiniForm', 'Gestionale.ClientiForm', 'Gestionale.Program')
            Test-Tab 1 10 @('Alta', 'Media', 'WF004', 'PJ001')
            Test-Tab 2 2 @('Dati', 'Gestionale', 'net48', 'net452', 'packages.config')
            Test-Tab 3 2 @('Dati', 'Gestionale', 'nessuna dipendenza', 'dipende da Dati')
          }
          catch {
            Fail "Controllo dell'interfaccia non riuscito: $($_.Exception.Message)"
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Interfaccia avviata, analisi completata e griglie verificate."

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolutionDoctor-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: publish
          retention-days: 14
