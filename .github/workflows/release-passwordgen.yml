# Crea una release di PasswordGen.
# - push di un tag passwordgen-vX.Y.Z: il tag deve corrispondere a <Version> in PasswordGen/Directory.Build.props;
# - avvio manuale (Actions → Release PasswordGen → Run workflow): la versione si legge da
#   Directory.Build.props e il tag passwordgen-vX.Y.Z viene creato insieme alla release.
# Compila su Windows (WPF .NET Framework 4.8), esegue i test e allega lo zip dell'applicazione.
name: Release PasswordGen

on:
  push:
    tags:
      - 'passwordgen-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versione
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content 'PasswordGen/Directory.Build.props'
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version }).Version
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagVersion = '${{ github.ref_name }}'.Substring('passwordgen-v'.Length)
            if ($tagVersion -ne $version) {
              throw "Il tag $tagVersion non corrisponde a <Version>$version</Version> in PasswordGen/Directory.Build.props"
            }
          }
          gh release view "passwordgen-v$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw "La release passwordgen-v$version esiste già: aggiornare <Version> prima di rilasciare." }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=passwordgen-v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Rilascio di PasswordGen $version"

      - name: Test
        run: dotnet test PasswordGen/tests/PasswordGen.Core.Tests/PasswordGen.Core.Tests.csproj -c Release

      - name: Build Release
        run: dotnet publish PasswordGen/src/PasswordGen/PasswordGen.csproj -c Release -o publish/PasswordGen

      - name: Crea lo zip
        shell: pwsh
        run: Compress-Archive -Path 'publish/PasswordGen/*' -DestinationPath 'PasswordGen-v${{ steps.version.outputs.version }}.zip'

      - name: Note di rilascio dal CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content 'PasswordGen/CHANGELOG.md' -Encoding UTF8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l.StartsWith("## [$version]") })
          if ($start -lt 0) { throw "Nessuna voce '## [$version]' in PasswordGen/CHANGELOG.md" }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l.StartsWith('## [') })
          if ($end -lt 0) { $end = $lines.Length }
          $notes = $lines[($start + 1)..($end - 1)] -join "`n"
          $notes += "`n`n**Requisiti:** Windows 10/11 con .NET Framework 4.8. Estrarre lo zip e avviare ``PasswordGen.exe``. Nessuna installazione e nessuna connessione di rete."
          $notes += "`n`n**Android:** scaricare ``PasswordGen-v$version.apk`` e installarlo (Android 7.0 o successivo; consentire l'installazione da origini sconosciute). Permessi: notifiche e riavvio del telefono (per il promemoria); nessun accesso alla rete. Gli aggiornamenti si installano sopra la versione precedente solo se firmata con la stessa chiave: dalla 1.6.0 in poi la chiave è fissa."
          Set-Content -Path 'release-notes.md' -Value $notes -Encoding UTF8

      - name: Crea la release
        shell: pwsh
        run: |
          gh release create '${{ steps.version.outputs.tag }}' 'PasswordGen-v${{ steps.version.outputs.version }}.zip' `
            --target '${{ github.sha }}' `
            --title 'PasswordGen v${{ steps.version.outputs.version }}' `
            --notes-file release-notes.md

  # APK Android: compilata dopo la release e allegata alla stessa release.
  # Con i secret ANDROID_KEYSTORE_* è firmata con la chiave fissa del repository; senza, con una chiave di debug generata al momento
  # (in quel caso ogni APK ha una firma diversa e un aggiornamento richiede di disinstallare la versione precedente).
  android:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Versione
        id: version
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' PasswordGen/Directory.Build.props)
          IFS=. read -r major minor patch <<< "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=passwordgen-v$version" >> "$GITHUB_OUTPUT"
          # Codice di versione di Android: cresce con la versione (1.4.0 -> 110400); il 100000 evita il conflitto con gli APK pubblicati prima della ripartenza da 1.0.0.
          echo "code=$((100000 + major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Workload Android (MAUI)
        run: dotnet workload install maui-android

      - name: APK (Release)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sign=()
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/passwordgen.keystore"
            sign=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/passwordgen.keystore"
                  "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
                  -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD)
            echo "Firma con la chiave fissa del repository."
          else
            echo "Nessuna chiave fissa configurata: APK firmata con la chiave di debug."
          fi
          dotnet publish PasswordGen/src/PasswordGen.Mobile/PasswordGen.Mobile.csproj \
            -c Release -f net10.0-android \
            -p:ApplicationVersion=${{ steps.version.outputs.code }} \
            -p:InstallAndroidDependencies=true -p:AcceptAndroidSDKLicenses=True \
            -o publish/android "${sign[@]}"

      - name: Allega l'APK alla release
        shell: bash
        run: |
          cp publish/android/net.francavilla.passwordgen-Signed.apk "PasswordGen-v${{ steps.version.outputs.version }}.apk"
          gh release upload '${{ steps.version.outputs.tag }}' "PasswordGen-v${{ steps.version.outputs.version }}.apk"
