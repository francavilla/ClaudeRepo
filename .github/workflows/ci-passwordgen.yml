# Integrazione continua di PasswordGen: a ogni push o PR compila su Windows (XAML compreso),
# esegue i test e rende scaricabile l'applicazione compilata come artifact del run.
name: CI PasswordGen

on:
  push:
    branches: [ main ]
    paths:
      - 'PasswordGen/**'
      - '.github/workflows/ci-passwordgen.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'PasswordGen/**'
      - '.github/workflows/ci-passwordgen.yml'
  workflow_dispatch:

# Un nuovo push sullo stesso branch annulla il run precedente ancora in corso.
concurrency:
  group: ci-passwordgen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Versione
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content 'PasswordGen/Directory.Build.props'
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version }).Version
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "PasswordGen $version"

      - name: Test (Core)
        run: dotnet test PasswordGen/tests/PasswordGen.Core.Tests/PasswordGen.Core.Tests.csproj -c Release

      - name: Test (ViewModel dell'app Windows)
        run: dotnet test PasswordGen/tests/PasswordGen.App.Tests/PasswordGen.App.Tests.csproj -c Release

      - name: Build Release (WPF + XAML)
        run: dotnet publish PasswordGen/src/PasswordGen/PasswordGen.csproj -c Release -o publish/PasswordGen -p:GoogleDesktopClientSecret=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}

      - name: Artifact
        uses: actions/upload-artifact@v6
        with:
          name: PasswordGen-${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: publish/PasswordGen
          retention-days: 14
