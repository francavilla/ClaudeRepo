# Integrazione continua dell'app Android di PasswordGen (.NET MAUI): compila il Core per netstandard2.0,
# produce l'APK e lo rende scaricabile come artifact del run. Su Linux il workload è "maui-android".
name: CI PasswordGen Android

on:
  push:
    branches: [ main ]
    paths:
      - 'PasswordGen/**'
      - '.github/workflows/ci-passwordgen-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'PasswordGen/**'
      - '.github/workflows/ci-passwordgen-android.yml'
  workflow_dispatch:

# Un nuovo push sullo stesso branch annulla il run precedente ancora in corso.
concurrency:
  group: ci-passwordgen-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Versione
        id: version
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' PasswordGen/Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "PasswordGen Android $version"

      - name: Workload Android (MAUI)
        run: dotnet workload install maui-android

      - name: Core (netstandard2.0)
        run: dotnet build PasswordGen/src/PasswordGen.Core/PasswordGen.Core.csproj -c Release -f netstandard2.0

      # Con i secret ANDROID_KEYSTORE_* l'APK è firmata con la chiave fissa del repository (gli aggiornamenti si installano
      # sopra la versione precedente); senza, con la chiave di debug generata a ogni build.
      - name: APK (Release)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sign=()
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/passwordgen.keystore"
            sign=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/passwordgen.keystore"
                  "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
                  -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD)
            echo "Firma con la chiave fissa del repository."
          else
            echo "Nessuna chiave fissa configurata: APK firmata con la chiave di debug."
          fi
          dotnet publish PasswordGen/src/PasswordGen.Mobile/PasswordGen.Mobile.csproj \
            -c Release -f net10.0-android \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:InstallAndroidDependencies=true -p:AcceptAndroidSDKLicenses=True \
            -o publish/android "${sign[@]}"

      - name: File prodotti
        run: find publish/android -maxdepth 2 -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasswordGen-Android-${{ steps.version.outputs.version }}-${{ github.run_number }}
          # Solo l'APK firmata: quella senza «-Signed» non si installa.
          path: publish/android/*-Signed.apk
          if-no-files-found: error
          retention-days: 14
