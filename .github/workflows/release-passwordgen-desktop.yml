# Crea la release di PasswordGen per DESKTOP (Windows). Quella per Android ha un suo workflow (release-passwordgen-android.yml)
# e una sua release, con un proprio tag: le due app si pubblicano separatamente.
# - push di un tag passwordgen-desktop-vX.Y.Z: il tag deve corrispondere a <Version> in PasswordGen/Directory.Build.props;
# - avvio manuale (Actions → Release PasswordGen Desktop → Run workflow): la versione si legge da
#   Directory.Build.props e il tag passwordgen-desktop-vX.Y.Z viene creato insieme alla release.
# Compila su Windows (WPF .NET Framework 4.8), esegue i test e allega lo zip dell'applicazione.
name: Release PasswordGen Desktop

on:
  push:
    tags:
      - 'passwordgen-desktop-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Versione
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content 'PasswordGen/Directory.Build.props'
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version }).Version
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tagVersion = '${{ github.ref_name }}'.Substring('passwordgen-desktop-v'.Length)
            if ($tagVersion -ne $version) {
              throw "Il tag $tagVersion non corrisponde a <Version>$version</Version> in PasswordGen/Directory.Build.props"
            }
          }
          gh release view "passwordgen-desktop-v$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw "La release passwordgen-desktop-v$version esiste già: aggiornare <Version> prima di rilasciare." }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=passwordgen-desktop-v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Rilascio di PasswordGen Desktop $version"

      - name: Test
        run: |
          dotnet test PasswordGen/tests/PasswordGen.Core.Tests/PasswordGen.Core.Tests.csproj -c Release
          dotnet test PasswordGen/tests/PasswordGen.App.Tests/PasswordGen.App.Tests.csproj -c Release

      - name: Build Release
        run: dotnet publish PasswordGen/src/PasswordGen/PasswordGen.csproj -c Release -o publish/PasswordGen

      - name: Crea lo zip
        shell: pwsh
        run: Compress-Archive -Path 'publish/PasswordGen/*' -DestinationPath 'PasswordGen-Desktop-v${{ steps.version.outputs.version }}.zip'

      - name: Note di rilascio dal CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content 'PasswordGen/CHANGELOG.md' -Encoding UTF8
          $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l.StartsWith("## [$version]") })
          if ($start -lt 0) { throw "Nessuna voce '## [$version]' in PasswordGen/CHANGELOG.md" }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l.StartsWith('## [') })
          if ($end -lt 0) { $end = $lines.Length }
          $notes = $lines[($start + 1)..($end - 1)] -join "`n"
          $notes += "`n`n**PasswordGen per Windows.** **Requisiti:** Windows 10/11 con .NET Framework 4.8. Estrarre lo zip e avviare ``PasswordGen.exe``. Nessuna installazione e nessuna connessione di rete."
          Set-Content -Path 'release-notes.md' -Value $notes -Encoding UTF8

      - name: Crea la release
        shell: pwsh
        run: |
          gh release create '${{ steps.version.outputs.tag }}' 'PasswordGen-Desktop-v${{ steps.version.outputs.version }}.zip' `
            --target '${{ github.sha }}' `
            --title 'PasswordGen Desktop v${{ steps.version.outputs.version }}' `
            --notes-file release-notes.md
