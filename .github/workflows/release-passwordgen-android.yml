# Crea la release di PasswordGen per ANDROID (APK). Quella per Windows ha un suo workflow (release-passwordgen-desktop.yml)
# e una sua release, con un proprio tag: le due app si pubblicano separatamente.
# - push di un tag passwordgen-android-vX.Y.Z: il tag deve corrispondere a <Version> in PasswordGen/Directory.Build.props;
# - avvio manuale (Actions → Release PasswordGen Android → Run workflow): la versione si legge da
#   Directory.Build.props e il tag passwordgen-android-vX.Y.Z viene creato insieme alla release.
# Con i secret ANDROID_KEYSTORE_* l'APK è firmata con la chiave fissa del repository; senza, con una chiave di debug generata al momento
# (in quel caso ogni APK ha una firma diversa e un aggiornamento richiede di disinstallare la versione precedente).
name: Release PasswordGen Android

on:
  push:
    tags:
      - 'passwordgen-android-v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Versione
        id: version
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' PasswordGen/Directory.Build.props)
          IFS=. read -r major minor patch <<< "$version"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tagVersion="${{ github.ref_name }}"
            tagVersion="${tagVersion#passwordgen-android-v}"
            if [ "$tagVersion" != "$version" ]; then
              echo "Il tag $tagVersion non corrisponde a <Version>$version</Version> in PasswordGen/Directory.Build.props"
              exit 1
            fi
          fi
          if gh release view "passwordgen-android-v$version" > /dev/null 2>&1; then
            echo "La release passwordgen-android-v$version esiste già: aggiornare <Version> prima di rilasciare."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=passwordgen-android-v$version" >> "$GITHUB_OUTPUT"
          # Codice di versione di Android (deve solo crescere, altrimenti l'aggiornamento è rifiutato come «downgrade»):
          # versione*1000 + 999. Le build di prova della CI hanno 1..998 sulla stessa versione, quindi la release è sempre la più alta.
          echo "code=$(( (major * 10000 + minor * 100 + patch) * 1000 + 999 ))" >> "$GITHUB_OUTPUT"

      - name: Workload Android (MAUI)
        run: dotnet workload install maui-android

      - name: APK (Release)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sign=()
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/passwordgen.keystore"
            sign=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/passwordgen.keystore"
                  "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
                  -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD)
            echo "Firma con la chiave fissa del repository."
          else
            echo "Nessuna chiave fissa configurata: APK firmata con la chiave di debug."
          fi
          dotnet publish PasswordGen/src/PasswordGen.Mobile/PasswordGen.Mobile.csproj \
            -c Release -f net10.0-android \
            -p:ApplicationVersion=${{ steps.version.outputs.code }} \
            -p:InstallAndroidDependencies=true -p:AcceptAndroidSDKLicenses=True \
            -o publish/android "${sign[@]}"

      - name: Note di rilascio dal CHANGELOG
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          awk -v v="## [$version]" 'index($0, v) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' PasswordGen/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Nessuna voce '## [$version]' in PasswordGen/CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "**PasswordGen per Android.** Scaricare \`PasswordGen-Android-v$version.apk\` e installarlo (Android 7.0 o successivo, telefono ARM a 64 bit; consentire l'installazione da origini sconosciute)."
            echo "Permessi: notifiche e riavvio del telefono (per il promemoria); rete solo per l'accesso facoltativo a Google Drive (la sincronizzazione)."
            echo "Gli aggiornamenti si installano sopra la versione precedente solo se firmata con la stessa chiave: dalla 1.6.0 in poi la chiave è fissa."
          } >> release-notes.md

      - name: Crea la release con l'APK
        shell: bash
        run: |
          cp publish/android/net.francavilla.passwordgen-Signed.apk "PasswordGen-Android-v${{ steps.version.outputs.version }}.apk"
          gh release create '${{ steps.version.outputs.tag }}' "PasswordGen-Android-v${{ steps.version.outputs.version }}.apk" \
            --target '${{ github.sha }}' \
            --title 'PasswordGen Android v${{ steps.version.outputs.version }}' \
            --notes-file release-notes.md
